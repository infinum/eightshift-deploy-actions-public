name: Continuous Integration - Plugin

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Run Node checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Lint assets
        uses: infinum/eightshift-deploy-actions-public/.github/actions/lint/node@main
        with:
          PROJECT_PATH: "."

  composer:
    name: Composer checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: PHP Static code analysis
        uses: infinum/eightshift-deploy-actions-public/.github/actions/lint/composer@main
        with:
          PROJECT_PATH: "."
          WORDPRESS_GH_ACTIONS: ${{ secrets.WORDPRESS_GH_ACTIONS }}
