name: Bundle artifact - plugin

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Add zip to artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout the project repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORDPRESS_GH_ACTIONS }}
          path: "wp-content/plugins/<plugin_name>"

      - name: Setup WordPress
        uses: infinum/eightshift-deploy-actions-public/.github/actions/setup/wordpress-plugins@feature/update
        with:
          WORDPRESS_GH_ACTIONS: ${{ secrets.WORDPRESS_GH_ACTIONS }}

      - name: Install plugin
        uses: infinum/eightshift-deploy-actions-public/.github/actions/setup/theme-or-plugin@feature/update
        with:
          PROJECT_PATH: "wp-content/plugins/<plugin_name>"
          WORDPRESS_GH_ACTIONS: ${{ secrets.WORDPRESS_GH_ACTIONS }}

      - name: Set cache
        uses: infinum/eightshift-deploy-actions-public/.github/actions/set/cache@feature/update
        with:
          PROJECT_PATH: "wp-content/plugins/<plugin_name>"

      - name: Post install cleanup - plugin
        uses: infinum/eightshift-deploy-actions-public/.github/actions/cleanup/project@feature/update
        with:
          PROJECT_PATH: "wp-content/plugins/<plugin_name>"

      - name: Setup correct folder/file permissions
        uses: infinum/eightshift-deploy-actions-public/.github/actions/set/permissions@feature/update
        with:
          PROJECT_PATH: "wp-content/plugins/<plugin_name>"

      - name: Zip Plugin
        shell: bash
        run: |
          cd wp-content/plugins
          zip -rq ../../release.zip <plugin_name>

      - name: Upload zip to artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.zip
