name: Deploy to server

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        type: choice
        description: "Target Environment"
        required: true
        default: "staging"
        options:
          - staging
          - production
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: Setup context - ${{ inputs.ENVIRONMENT != '' && inputs.ENVIRONMENT || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT != '' && inputs.ENVIRONMENT || 'staging' }}
    outputs:
      environment: ${{ inputs.ENVIRONMENT != '' && inputs.ENVIRONMENT || 'staging' }}
    steps:
      - id: get
        run: |
          echo "environment=${{ inputs.ENVIRONMENT != '' && inputs.ENVIRONMENT || 'staging' }}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    needs: [context]
    steps:
      - name: Setup WordPress
        uses: infinum/eightshift-deploy-actions-public/.github/actions/setup/wordpress@main
        with:
          WORDPRESS_GH_ACTIONS: ${{ secrets.WORDPRESS_GH_ACTIONS }}

      - name: Setup custom secrets as environment variables
        uses: infinum/eightshift-deploy-actions-public/.github/actions/set/env@main
        with:
          VARS: |
            WORDPRESS_DB_NAME=${{ secrets.DB_NAME }}
            WORDPRESS_DB_USER=${{ secrets.DB_USER }}
            WORDPRESS_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            WORDPRESS_DB_HOST=${{ secrets.DB_HOST }}
            WORDPRESS_AUTH_KEY=${{ secrets.AUTH_KEY }}
            WORDPRESS_SECURE_AUTH_KEY=${{ secrets.SECURE_AUTH_KEY }}
            WORDPRESS_LOGGED_IN_KEY=${{ secrets.LOGGED_IN_KEY }}
            WORDPRESS_NONCE_KEY=${{ secrets.NONCE_KEY }}
            WORDPRESS_AUTH_SALT=${{ secrets.AUTH_SALT }}
            WORDPRESS_SECURE_AUTH_SALT=${{ secrets.SECURE_AUTH_SALT }}
            WORDPRESS_LOGGED_IN_SALT=${{ secrets.LOGGED_IN_SALT }}
            WORDPRESS_NONCE_SALT=${{ secrets.NONCE_SALT }}
            WORDPRESS_CACHE_KEY_SALT=${{ secrets.WP_CACHE_KEY_SALT }}
            WP_ENVIRONMENT_TYPE=${{ needs.context.outputs.environment }}

      - name: Install all plugins
        uses: infinum/eightshift-deploy-actions-public/.github/actions/plugins/install@main
        with:
          WORDPRESS_GH_ACTIONS: ${{ secrets.WORDPRESS_GH_ACTIONS }}

      - name: Install plugin
        uses: infinum/eightshift-deploy-actions-public/.github/actions/setup/theme-or-plugin@main
        with:
          PROJECT_PATH: wp-content/plugins/<plugin_name>
          WORDPRESS_GH_ACTIONS: ${{ secrets.WORDPRESS_GH_ACTIONS }}

      - name: Set cache
        uses: infinum/eightshift-deploy-actions-public/.github/actions/set/cache@main
        with:
          PROJECT_PATH: wp-content/plugins/<plugin_name>

      - name: Update version number
        uses: infinum/eightshift-deploy-actions-public/.github/actions/set/version-plugin@main
        with:
          PROJECT_PATH: wp-content/plugins/<plugin_name>

      - name: Post install cleanup - root
        uses: infinum/eightshift-deploy-actions-public/.github/actions/cleanup/root@main

      - name: Post install cleanup - project
        uses: infinum/eightshift-deploy-actions-public/.github/actions/cleanup/project@main
        with:
          PROJECT_PATH: wp-content/plugins/<plugin_name>

      - name: Setup correct folder/file permissions
        uses: infinum/eightshift-deploy-actions-public/.github/actions/set/permissions@main

      - name: Copy config files
        run: |
          cp ./config/wp-config-helpers.php ./wp-config-helpers.php
          cp ./config/wp-constants.php ./wp-constants.php
          cp ./config/wp-constants-server.php ./wp-constants-server.php
          cp ./config/wp-constants-project.php ./wp-constants-project.php
          cp ./config/wp-config.php ./wp-config.php
          cp ./config/wordfence-waf.php ./wordfence-waf.php
          rm -rf ./config
          rm -rf ./docs

      - name: Zip everything for deployment
        shell: bash
        run: zip -rq release.zip .

      - name: Upload release to artifacts
        uses: actions/upload-artifact@v7
        with:
          path: release.zip

  deploy:
    name: Deploy to the server
    runs-on: [self-hosted, "${{ needs.context.outputs.environment }}"]
    environment: ${{ needs.context.outputs.environment }}
    needs: [context, build-and-push]
    cancel-timeout-minutes: 5
    steps:
      - name: Deploy to server
        uses: infinum/eightshift-deploy-actions-public/.github/actions/ssh/server-deploy-self-hosted-runner@main
        with:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_ROOT: ${{ secrets.SERVER_ROOT }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    needs: [context, build-and-push, deploy]
    steps:
      - name: Notify
        uses: infinum/eightshift-deploy-actions-public/.github/actions/slack-notification@main
        with:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
