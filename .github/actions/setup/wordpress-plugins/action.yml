name: Install WordPress with core for building plugins
description: 'Install WordPress with core for building plugins'

inputs:
  PHP_VERSION:
    type: string
    description: "PHP version to use. Available options are 8.2, 8.3, 8.4, etc."
    required: false
    default: "8.4"
  WORDPRESS_GH_ACTIONS:
    type: string
    description: "GitHub PAT token for the WordPress repository deployment"
    required: true

runs:
  using: composite
  steps:
    - name: Start MySQL
      shell: bash
      run: |
        if [ -d /run/systemd/system ]; then
          sudo systemctl start mysql.service
        elif [ -x /etc/init.d/mysql ]; then
          sudo /etc/init.d/mysql start
        else
          sudo service mysql start
        fi

        for i in $(seq 1 30); do
          if MYSQL_PWD=root mysqladmin ping -h 127.0.0.1 -u root --silent; then
            exit 0
          fi
          sleep 1
        done

        echo "::error::MySQL did not become ready within 30 seconds"
        exit 1

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.PHP_VERSION }}
        coverage: none
        tools: composer:v2, wp-cli

    - name: WordPress setup
      shell: bash
      run: |
        wp core download --skip-content
        wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
        wp db create
        wp config set WP_ENVIRONMENT_TYPE 'production'
        wp core install --url=test.test --title="Deploy" --admin_user=test --admin_password=test --admin_email=test@test.com
