name: Install theme/plugin
description: "Install theme/plugin"

inputs:
  PROJECT_PATH:
    type: string
    description: "Path to the project folder from the root of the repository. Usually wp-content/themes/<theme_name> or wp-content/plugins/<plugin_name>"
    required: true
  BUILD_SOURCEMAPS:
    type: string
    description: "If true, run a second build with sourcemaps enabled (output goes to public-sourcemaps/)"
    default: "false"
  USE_BUN:
    type: string
    description: "If true, use Bun to build assets"
    default: "true"
  USE_COMPOSER:
    type: string
    description: "If true, use Composer to install dependencies"
    default: "true"
  PHP_VERSION:
    type: string
    description: "PHP version to use. Available options are 8.2, 8.3, 8.4, etc."
    required: false
    default: "8.4"
  WORDPRESS_GH_ACTIONS:
    type: string
    description: "GitHub PAT token for the WordPress repository deployment"
    required: false
  COMPOSER_OPTIONS:
    type: string
    description: "Extra flags passed to `composer install` (e.g. '--no-dev --optimize-autoloader')"
    required: false
    default: ""
  BUN_INSTALL_ARGS:
    type: string
    description: "Flags passed to `bun install` before the build step"
    required: false
    default: "--ignore-scripts --frozen-lockfile --production"

runs:
  using: composite
  steps:
    - name: PHP setup
      uses: shivammathur/setup-php@v2
      if: inputs.USE_COMPOSER == 'true'
      with:
        php-version: ${{ inputs.PHP_VERSION }}
        coverage: none
        tools: composer:v2

    - name: Install dependencies
      uses: "infinum/eightshift-deploy-actions-public/.github/actions/set/composer-install@main"
      if: inputs.USE_COMPOSER == 'true'
      with:
        PROJECT_PATH: ${{ inputs.PROJECT_PATH }}
        WORDPRESS_GH_ACTIONS: ${{ inputs.WORDPRESS_GH_ACTIONS }}
        COMPOSER_OPTIONS: ${{ inputs.COMPOSER_OPTIONS }}

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      if: inputs.USE_BUN == 'true'
      with:
        bun-version: latest

    - name: Install assets packages with bun
      working-directory: ${{ inputs.PROJECT_PATH }}
      if: inputs.USE_BUN == 'true'
      shell: bash
      run: |
        bun install ${{ inputs.BUN_INSTALL_ARGS }}
        bun run build

    - name: Build assets with sourcemaps (bun)
      working-directory: ${{ inputs.PROJECT_PATH }}
      if: inputs.BUILD_SOURCEMAPS == 'true' && inputs.USE_BUN == 'true'
      shell: bash
      run: bun run build:sourcemaps
